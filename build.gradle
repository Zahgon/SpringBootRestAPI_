plugins {
    id 'java'
    id 'jacoco'
    id 'org.sonarqube' version '5.1.0.4882'
}

group = 'com.gourav'
version = '0.0.1-SNAPSHOT'

description = """restApi"""

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

ext {
    jakartaeeVersion = '10.0.0'
    jerseyVersion = '3.1.9'
    tomcatVersion = '10.1.31'
    weldVersion = '5.1.2.Final'
    jacksonVersion = '2.17.2'
    hibernateValidatorVersion = '8.0.1.Final'
    mongoDriverVersion = '5.2.1'
    swaggerVersion = '2.2.22'
    swaggerUiVersion = '5.17.14'
}

dependencies {
    // Jakarta EE 10 API set
    implementation "jakarta.platform:jakarta.jakartaee-web-api:${jakartaeeVersion}"

    // Jakarta RESTful Web Services 3.1 on Jakarta Servlet 6.0
    implementation "org.glassfish.jersey.containers:jersey-container-servlet:${jerseyVersion}"
    implementation "org.glassfish.jersey.inject:jersey-hk2:${jerseyVersion}"
    implementation "org.glassfish.jersey.media:jersey-media-json-jackson:${jerseyVersion}"
    implementation "org.glassfish.jersey.ext:jersey-bean-validation:${jerseyVersion}"
    implementation "org.apache.tomcat.embed:tomcat-embed-core:${tomcatVersion}"

    // Jakarta Contexts and Dependency Injection 4.0
    implementation "org.jboss.weld.se:weld-se-core:${weldVersion}"

    // Jakarta Validation 3.0
    implementation "org.hibernate.validator:hibernate-validator:${hibernateValidatorVersion}"
    implementation 'org.glassfish.expressly:expressly:5.0.0'

    // JSON
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // MongoDB
    implementation "org.mongodb:mongodb-driver-sync:${mongoDriverVersion}"

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Password hashing
    implementation 'at.favre.lib:bcrypt:0.10.2'

    // OpenAPI / Swagger UI
    implementation "io.swagger.core.v3:swagger-jaxrs2-jakarta:${swaggerVersion}"
    implementation "org.webjars:swagger-ui:${swaggerUiVersion}"

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.16'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.8'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Test
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Lombok for tests
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Deployment contract (Procfile): `java -jar build/libs/rest_tutorial-0.0.1-SNAPSHOT.jar`.
// Dependencies are copied next to the jar and referenced from the manifest Class-Path so the
// Jakarta service-provider metadata (META-INF/services, beans.xml) of every artifact stays intact.
tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('libs/lib')
}

tasks.named('jar') {
    dependsOn 'copyDependencies'
    manifest {
        attributes(
            'Main-Class': 'com.gourav.restapi.RestApiApplication',
            'Class-Path': configurations.runtimeClasspath.collect { 'lib/' + it.name }.join(' ')
        )
    }
}

tasks.register('stage') {
    dependsOn 'build'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70
            }
        }
    }
}

check.dependsOn jacocoTestReport



sonar {
    properties {
        property 'sonar.projectKey', 'GouravRusiya30_SpringBootRestAPI'
    }
}
